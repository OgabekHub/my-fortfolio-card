<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevCard Og'abek</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- container -->
    <div class="container">
        <div class="card">
            <div class="card-inner">
                <div class="card-front">
                    <div class="aylana"></div>
                    <div class="skills-orbit">
                        <i class="fa-brands fa-html5 skill-icon" style="--i: 1; color: #E34F26;"></i>
                        <i class="fa-brands fa-css3-alt skill-icon" style="--i: 2; color: #1572B6;"></i>
                        <i class="fa-brands fa-js skill-icon" style="--i: 3; color: #F7DF1E;"></i>
                        <i class="fa-brands fa-react skill-icon" style="--i: 4; color: #61DAFB;"></i>
                    </div>
                </div>
                <div class="card-back">
                    <div class="header-group">
                        <div class="aylana smaller"></div>
                        <h4>Og'abek Olimjonov</h4>
                    </div>
                    <p>Frontend Developer</p>
                    <div class="btn">
                        <a href="https://t.me/olimjonov_ogabek" target="_blank"><i class="fa-brands fa-telegram"></i> Telegram</a>
                        <a href="https://github.com/OgabekHub" target="_blank"><i class="fa-brands fa-github"></i> GitHub</a>
                    </div>
                    <a class="button" href="https://olimjonov-ogabek-dev.netlify.app/" target="_blank"><i class="fa-solid fa-globe"></i> Portfolio</a>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
